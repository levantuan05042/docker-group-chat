server.port=${PORT:8080}

# Cấu hình DataSource MySQL (Hỗ trợ cả chạy trực tiếp, Docker lẫn Render Cloud)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tododb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:050402}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình JPA & Hibernate tự động sinh bảng
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
